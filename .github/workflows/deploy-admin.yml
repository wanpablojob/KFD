# Continuous Deployment for the KFD admin (Next.js) app.
#
# Staging:  every pull request to `main` deploys a Vercel Preview URL
#           (GitHub Environment: `staging`).
# Production: manual `workflow_dispatch` only, from `main`, with
#           `target=production` and `confirm_production=deploy`. The job also
#           refuses to run unless the `CI OK` check for the commit is green.
#           Native required reviewers require GitHub Pro; see README.md.
#
# Required repository secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#
# See README.md -> "CI/CD" for setup steps.

name: Deploy Admin

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (staging deploys from pull requests)
        type: choice
        options: [staging, production]
        default: staging
      confirm_production:
        description: 'Type "deploy" to confirm a production deploy'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write
  deployments: write
  checks: read

concurrency:
  group: deploy-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  # ---- Staging (Pull Request preview) ---------------------------------
  preview:
    name: Deploy staging preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: Verify Vercel secrets are present
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it in Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      # Pinned deliberately. vercel@latest broke `vercel pull` on 60.1.3
      # (published 2026-09-26) with "Could not retrieve Project Settings",
      # failing CI with no repo change. Bump only after a deploy is green.
      - name: Install Vercel CLI
        run: npm install --global vercel@60.0.1

      - name: Pull Vercel environment (preview)
        working-directory: .
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        # From the repo root, not admin/: the project's Root Directory is
        # `admin`, and the CLI joins it onto the working directory. Running
        # from admin/ made it look for admin/admin/package.json.
        working-directory: .
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (preview)
        id: deploy
        working-directory: .
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const url = `${{ steps.deploy.outputs.url }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Admin preview deployed to ${url}`,
            });

  # ---- Production ------------------------------------------------------
  # Manual, from main, with an explicit confirmation string. This replaces
  # the `production` environment's required-reviewer rule, which GitHub only
  # offers on Pro/Team/Enterprise plans for private repositories. The job
  # also checks the `CI OK` status for the exact commit before deploying.
  production:
    name: Deploy production
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'production' &&
      inputs.confirm_production == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: Verify CI is green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI OK")] | sort_by(.completed_at) | last | .conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI OK is ${conclusion:-missing} for ${GITHUB_SHA}; refusing to deploy."
            exit 1
          fi
          echo "CI OK is green for ${GITHUB_SHA}."

      - name: Verify Vercel secrets are present
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it in Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@60.0.1

      - name: Pull Vercel environment (production)
        working-directory: .
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        working-directory: .
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (production)
        id: deploy
        working-directory: .
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # ---- What happened ---------------------------------------------------
  # A production deploy that did not run should say why. This job has no
  # `needs` on purpose: it must not wait for the production job.
  summary:
    name: Deploy summary
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Explain the outcome
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm_production }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Deploy summary"
            echo ""
            if [ "$EVENT" = "pull_request" ]; then
              echo "Pull request: the preview job deploys to Vercel staging. Production is a manual dispatch from main."
            elif [ "$EVENT" = "workflow_dispatch" ]; then
              if [ "$TARGET" = "production" ] && [ "$CONFIRM" = "deploy" ]; then
                echo "Manual production deploy for \`$HEAD_SHA\`."
                echo ""
                echo "It runs only after the \`CI OK\` check for this commit is green."
              else
                echo "Manual run, but no deploy job matched (target=\`$TARGET\`, confirm=\`$CONFIRM\`)."
                echo ""
                echo "Staging deploys from pull requests. To deploy production: target=production and confirm_production=deploy."
              fi
            else
              echo "Unrecognised event \`$EVENT\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
