# Continuous Deployment for the KFD admin (Next.js) app.
#
# Staging:  every pull request to `main` deploys a Vercel Preview URL
#           (GitHub Environment: `staging`).
# Production: every successful CI run on `main` that touched `admin/`
#           deploys to Vercel Production (GitHub Environment: `production`,
#           add required reviewers there to gate releases).
#
# Required repository secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#
# See README.md -> "CI/CD" for setup steps.

name: Deploy Admin

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  # ---- Staging (Pull Request preview) ---------------------------------
  preview:
    name: Deploy staging preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const url = `${{ steps.deploy.outputs.url }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Admin preview deployed to ${url}`,
            });

  # ---- Detect whether `admin/` changed (for the production deploy) ----
  changed:
    name: Detect admin changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Check changed paths
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify HEAD^ >/dev/null 2>&1 && git diff --name-only HEAD^ HEAD 2>/dev/null | grep -qE '^(admin/|\.github/|\.vscode/|package(-lock)?\.json)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            # Initial commit or no admin-related changes — still deploy for safety
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  # ---- Production ------------------------------------------------------
  production:
    name: Deploy production
    needs: changed
    if: |
      needs.changed.outputs.deploy == 'true' &&
      (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
