# Configure Supabase Auth: the mailer, the email rate limits and the
# "Reset password" template.
#
# GoTrue's settings are not in the database. They live in the project's
# configuration and can only be read and written through the Management API,
# which needs a personal access token -- so this is the path for changing them,
# the same way migrate-db.yml is the path for changing the schema.
#
# Why the template matters: the app's forgot-password screen types a 6-digit
# code, not a link. The recovery email has to carry {{ .Token }} for that to
# work (mobile/src/lib/auth.ts says the same in a comment). The template is
# product copy, so it lives in the repo (admin/supabase/auth/) and is applied
# from here.
#
# Why the rate limits: Supabase's default allows 2 emails per hour to one
# address, and one every 60 seconds. A customer who mistypes their address
# twice, or asks for a code twice, hits a wall that looks like a broken app.
#
# The Management API's field names are flat and specific -- the recovery
# template is mailer_templates_recovery_content, the code length is
# mailer_otp_length, and the SMTP settings are smtp_host / smtp_port /
# smtp_user / smtp_pass / smtp_admin_email / smtp_sender_name. The endpoint
# answers 200 to a body it does not recognise, so the step reads the settings
# back afterwards and prints what is actually stored.
#
# workflow_dispatch only, for the same reason as migrate-db.yml: who can
# receive a password-reset mail is not something a push should decide.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN   a Supabase personal access token
#   RESEND_API_KEY          the Resend API key -- it is the SMTP password
# Optional repository secret:
#   AUTH_EMAIL_FROM         the address the mail is sent from. Defaults to the
#                           address the order mail already uses
#                           (orders@notifications.kfd.ph), which has to be a
#                           verified domain on the Resend account.
#
# The Resend SMTP endpoint is smtp.resend.com on port 465, user "resend", and
# the API key is the password. There is no separate SMTP password to create.

name: Configure Supabase Auth

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the settings that would be applied, change nothing"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: configure-auth
  cancel-in-progress: false

jobs:
  configure:
    name: Configure auth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same environment as the migrations. After the secrets move to the
    # environment scope (A7), a job without this environment could not read
    # them at all.
    environment: production

    env:
      PROJECT_REF: ijeqwbrrgfsmymsektih
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # The key the owner put in the production environment, under this name.
      RESEND_KEY: ${{ secrets.RESEND_KEY }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the settings
        run: |
          set -euo pipefail
          if [ -n "${RESEND_API_KEY:-}" ]; then
            echo "::add-mask::${RESEND_API_KEY}"
          fi
          node <<'NODE' > "$RUNNER_TEMP/settings.json"
          const fs = require("fs");

          (async () => {
          const ref = process.env.PROJECT_REF;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const template = fs.readFileSync("admin/supabase/auth/reset-password.txt", "utf8");

          if (!token) {
            console.error("SUPABASE_ACCESS_TOKEN is not set; nothing to do.");
            process.exit(1);
          }

          const headers = {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          };

          // The Resend key from the Vercel production environment, if the
          // owner put it there. Only a "plain" or "encrypted" variable can be
          // read back; a "sensitive" one is write-only by design.
          async function resendKeyFromVercel() {
            const vToken = process.env.VERCEL_TOKEN;
            const project = process.env.VERCEL_PROJECT_ID;
            const team = process.env.VERCEL_ORG_ID;
            if (!vToken || !project) return null;
            const q = team ? `?teamId=${team}&decrypt=true` : "?decrypt=true";
            const res = await fetch(
              `https://api.vercel.com/v10/projects/${project}/env${q}`,
              { headers: { Authorization: `Bearer ${vToken}` } }
            );
            if (!res.ok) return null;
            const payload = await res.json();
            const envs = payload.envs || [];
            const hit =
              envs.find((e) => e.key === "RESEND_API_KEY" && e.value) ||
              envs.find((e) => e.key === "RESEND_KEY" && e.value);
            return hit ? hit.value : null;
          }

          // Read what is set now, so the PATCH only changes the fields this
          // workflow owns: a setting the owner changed by hand, or one this
          // file does not mention, survives.
          const current = await (
            await fetch(`https://api.supabase.com/v1/projects/${ref}/config/auth`, { headers })
          ).json();

          const body = {
            // The code the app types, and how long it lives.
            mailer_otp_length: 6,
            mailer_otp_exp: 3600,
            // The recovery email. The dashboard calls this the "Reset
            // password" template; the API calls it recovery.
            mailer_subjects_recovery: "Your KFD password reset code",
            mailer_templates_recovery_content: template,
            // A reset link is a way to take an account over, so it needs the
            // old password as well as the mail.
            mailer_secure_email_change_enabled: true,
            mailer_autoconfirm: false,
          };

          // The Resend key: the repository secret, or the one the admin app
          // already has in the Vercel production environment. The owner put
          // it there; the app reads RESEND_API_KEY, so both names are tried.
          // A "sensitive" Vercel variable cannot be read back, so that case
          // ends with the warning below and the owner is asked to add the key
          // under the name the code reads.
          let resendKey = process.env.RESEND_API_KEY || process.env.RESEND_KEY;
          if (!resendKey) {
            resendKey = await resendKeyFromVercel();
            if (resendKey) {
              console.error("::notice::Using the Resend key from the Vercel production environment.");
            }
          }

          if (resendKey) {
            console.error("::add-mask::" + resendKey);
            body.smtp_host = "smtp.resend.com";
            body.smtp_port = "465";
            body.smtp_user = "resend";
            body.smtp_pass = resendKey;
            body.smtp_admin_email =
              process.env.AUTH_EMAIL_FROM || "orders@notifications.kfd.ph";
            body.smtp_sender_name = "KFD";
            body.smtp_max_frequency = 30;
            // The rate limit belongs to the custom mailer, not to Supabase's
            // built-in one: the Management API refuses RATE_LIMIT_EMAIL_SENT
            // without SMTP_SENDER_NAME ("Custom SMTP required to configure
            // SMTP_SENDER_NAME or RATE_LIMIT_EMAIL_SENT"). So it is set with
            // the mailer, not before it.
            body.rate_limit_email_sent = 30;

            // The domains the Resend account may send from. The address the
            // mail is sent as has to be one of them, or the mail is rejected
            // by Resend and the reset code never arrives.
            const domains = await fetch("https://api.resend.com/domains", {
              headers: { Authorization: `Bearer ${resendKey}` },
            });
            if (domains.ok) {
              const payload = await domains.json();
              const list = (payload.data || []).map((d) => `${d.name} (${d.status})`);
              console.error(
                "::notice::Resend domains: " + (list.length ? list.join(", ") : "none")
              );
            }
          } else {
            console.error(
              "::warning::RESEND_API_KEY is not set: the mailer, the sender name and the email rate limit are left as they are. The Management API will not raise the limit without a custom mailer."
            );
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + "/body.json", JSON.stringify(body));
          // The SMTP password is masked, so the dry run can be read.
          const redacted = JSON.parse(JSON.stringify(body));
          if (redacted.smtp_pass) redacted.smtp_pass = "***";
          console.log("Settings to apply:");
          console.log(JSON.stringify(redacted, null, 2));
          console.log("");
          console.log("The project currently reports:");
          const now = {
            mailer_otp_length: current.mailer_otp_length,
            mailer_otp_exp: current.mailer_otp_exp,
            rate_limit_email_sent: current.rate_limit_email_sent,
            smtp_host: current.smtp_host,
            smtp_admin_email: current.smtp_admin_email,
            recovery_template_has_token:
              (current.mailer_templates_recovery_content || "").includes("{{ .Token }}"),
          };
          console.log(JSON.stringify(now, null, 2));
          })().catch((e) => {
            console.error(e);
            process.exit(1);
          });
          NODE
          cat "$RUNNER_TEMP/settings.json"

      - name: Apply the settings
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/body.json")
          code=$(printf '%s' "$response" | tail -n1)
          payload=$(printf '%s' "$response" | sed '$d')
          if [ "$code" != "200" ]; then
            echo "error: the Management API answered $code" >&2
            printf '%s' "$payload" | head -c 2000 >&2
            echo >&2
            exit 1
          fi
          echo "Applied. What the project stores now:"
          curl -sS "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const c = JSON.parse(s);
                console.log(JSON.stringify({
                  mailer_otp_length: c.mailer_otp_length,
                  mailer_otp_exp: c.mailer_otp_exp,
                  rate_limit_email_sent: c.rate_limit_email_sent,
                  smtp_host: c.smtp_host,
                  smtp_port: c.smtp_port,
                  smtp_user: c.smtp_user,
                  smtp_admin_email: c.smtp_admin_email,
                  smtp_sender_name: c.smtp_sender_name,
                  smtp_password_set: !!c.smtp_pass,
                  recovery_subject: c.mailer_subjects_recovery,
                  recovery_template_has_token:
                    (c.mailer_templates_recovery_content || "").includes("{{ .Token }}"),
                }, null, 2));
              });
            '

      - name: Check the mailer
        if: ${{ !inputs.dry_run }}
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");

          (async () => {
          const key = process.env.RESEND_API_KEY || process.env.RESEND_KEY;
          if (!key) {
            console.log("No Resend key: nothing to check.");
            return;
          }
          console.error("::add-mask::" + key);
          const from = process.env.AUTH_EMAIL_FROM || "orders@notifications.kfd.ph";

          // Which domains the account may send from. The address the mail is
          // sent as has to be one of them, or Resend refuses the message.
          const domains = await fetch("https://api.resend.com/domains", {
            headers: { Authorization: `Bearer ${key}` },
          });
          if (domains.ok) {
            const payload = await domains.json();
            const list = (payload.data || []).map((d) => `${d.name} (${d.status})`);
            console.log("Resend domains: " + (list.length ? list.join(", ") : "none"));
          } else {
            console.log("Resend domains: could not be read (" + domains.status + ")");
          }

          // A real send, through the same key, from the same address the
          // mailer uses. This is what tells the owner what to fix: a domain
          // that is not verified says so in the error.
          const sent = await fetch("https://api.resend.com/emails", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${key}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              from: `KFD <${from}>`,
              to: ["appreview.customer@kfd.ph"],
              subject: "KFD mailer check",
              text: "The KFD mailer is working.",
            }),
          });
          const sentBody = await sent.text();
          console.log(
            sent.ok
              ? "Test mail sent: " + sentBody.slice(0, 200)
              : "Test mail refused (" + sent.status + "): " + sentBody.slice(0, 400)
          );

          // When that address is refused, the account may still have a verified
          // domain that simply is not the one configured -- a parent domain, or
          // a different subdomain. This key cannot list the domains (401 on
          // /domains is normal for a sending-only key), so the only way to ask
          // is to send: Resend refuses a from-address whose domain it has not
          // verified, and accepts one it has.
          //
          // Sent to delivered@resend.dev, Resend's sandbox recipient, so a
          // successful probe tells us the domain is good without putting mail
          // in anybody's inbox.
          if (!sent.ok) {
            const candidates = [
              "orders@kfd.ph",
              "noreply@kfd.ph",
              "no-reply@kfd.ph",
              "kfd@kfd.ph",
              "orders@mail.kfd.ph",
              "orders@notifications.kfd.ph",
              "onboarding@resend.dev",
            ].filter((c) => c !== from);
            console.log("Probing " + candidates.length + " candidate from-addresses...");
            const accepted = [];
            for (const candidate of candidates) {
              const probe = await fetch("https://api.resend.com/emails", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${key}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  from: `KFD <${candidate}>`,
                  to: ["delivered@resend.dev"],
                  subject: "KFD mailer probe",
                  text: "Probe only.",
                }),
              });
              const detail = probe.ok ? "ok" : (await probe.text()).slice(0, 160);
              console.log(`  ${probe.ok ? "VERIFIED" : "refused " + probe.status} ${candidate} ${probe.ok ? "" : "-- " + detail}`);
              if (probe.ok) accepted.push(candidate);
            }
            console.log(
              accepted.length
                ? "::notice::Verified sending addresses: " + accepted.join(", ") +
                    ". Set AUTH_EMAIL_FROM and ORDER_EMAIL_FROM to one of them."
                : "::warning::No candidate from-address is verified. Verify a domain at https://resend.com/domains, then re-run this workflow."
            );
          }

          // And the whole path the customer walks: a reset code, through
          // Supabase, out through the mailer.
          const pub = process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY;
          if (pub) {
            const recover = await fetch(
              "https://ijeqwbrrgfsmymsektih.supabase.co/auth/v1/recover",
              {
                method: "POST",
                headers: { apikey: pub, "Content-Type": "application/json" },
                body: JSON.stringify({
                  email: "appreview.customer@kfd.ph",
                  redirect_to: "https://kfd-one.vercel.app/support",
                }),
              }
            );
            const recoverBody = await recover.text();
            console.log(
              "Password reset through Supabase: " +
                recover.status +
                " " +
                recoverBody.slice(0, 300)
            );
          }
          })().catch((e) => {
            console.error(String(e));
            process.exit(1);
          });
          NODE

      - name: Report the current settings
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          curl -sS "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const c = JSON.parse(s);
                console.log("The project currently reports:");
                console.log(JSON.stringify({
                  mailer_otp_length: c.mailer_otp_length,
                  mailer_otp_exp: c.mailer_otp_exp,
                  rate_limit_email_sent: c.rate_limit_email_sent,
                  smtp_host: c.smtp_host,
                  smtp_admin_email: c.smtp_admin_email,
                  recovery_template_has_token:
                    (c.mailer_templates_recovery_content || "").includes("{{ .Token }}"),
                }, null, 2));
              });
            '
