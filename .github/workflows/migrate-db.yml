# Apply Supabase database migrations to the linked project.
#
# This workflow exists because migrations can only be applied with a direct
# Postgres connection, which needs `SUPABASE_DB_PASSWORD`. Without it, nobody
# (including CI and the Supabase CLI) can apply a migration -- every schema
# change has to be copy-pasted by hand into the dashboard SQL Editor, which is
# unauditable and easy to get wrong.
#
# Deliberate design decisions:
#   * `workflow_dispatch` ONLY. There is no `push`/`schedule` trigger. A
#     migration must never be applied as a side effect of a commit landing.
#   * `environment: production` gates every run behind required reviewers
#     (configure under Settings -> Environments). This is the actual
#     permission boundary: it means an unreviewed change cannot reach the
#     live database without a human approving it.
#   * `max_pending` defaults to 1. Applying a pile of migrations that nobody
#     intended to ship is the classic way to break a production database, so
#     bulk application is opt-in and must be requested deliberately.
#   * The CLI version is pinned. An unpinned CLI silently pulls new major
#     versions, which can change migration semantics between runs.
#
# Required repository secrets:
#   SUPABASE_DB_PASSWORD    -- direct Postgres password (dashboard -> Settings -> Database)
#   SUPABASE_ACCESS_TOKEN   -- personal access token (dashboard -> account -> Access Tokens)
#
# Usage:
#   1. Run with `dry_run: true` first. This prints the SQL without applying it.
#   2. Re-run with `dry_run: false` to apply.

name: Migrate Database

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only -- print the SQL, apply nothing"
        type: boolean
        required: true
        default: true
      max_pending:
        description: >-
          Refuse to run if more than this many migrations are pending.
          Raise deliberately, never reflexively.
        type: number
        required: false
        default: 1
      verify_only:
        description: "Check the schema without applying anything"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Never let two migration runs overlap.
  group: migrate-db
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest

    # The approval gate. `environment` is only honoured on a job, never at
    # workflow level -- a top-level key is silently ignored, which would run
    # migrations against production with no human in the loop.
    # Configure required reviewers: Settings -> Environments -> production.
    environment: production
    defaults:
      run:
        working-directory: admin

    # Both tokens must be exported as env vars, not just passed to
    # `setup-cli`. That action runs `supabase login`, but each `run:` step
    # starts a fresh shell that does not inherit the login -- so `supabase
    # link` fails with "Access token not provided" unless the token is also
    # in the environment.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
          token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Initialise local Supabase config
        # `config.toml` is gitignored, so it is absent on a fresh runner.
        # `init` only writes the file; it does not touch existing migrations.
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "config.toml missing -- running supabase init"
            supabase init
          else
            echo "config.toml already present"
          fi

      - name: Link to project
        # Ref is hard-coded on purpose. A workflow that accepts a project ref
        # as input could be pointed at a different database by anyone who can
        # dispatch it.
        run: supabase link --project-ref ijeqwbrrgfsmymsektih

      - name: Report migration status
        run: |
          echo "::group::Migration status"
          supabase migration list || true
          echo "::endgroup::"

          # Count pending migrations as (files on disk) - (rows the CLI reports
          # as applied). Do NOT try to parse which column is which: the CLI
          # renders versions backtick-wrapped (`` `0001` ``) and the column
          # layout has changed between releases. Counting the local files is
          # deterministic and cannot silently drift into reporting 0.
          local_count=$(ls -1 supabase/migrations/*.sql 2>/dev/null | wc -l | tr -d ' ')
          applied=$(supabase migration list 2>/dev/null \
            | grep -cE '^[[:space:]]*`[0-9]+`[[:space:]]*\|[[:space:]]*`[0-9]+`' || true)
          applied=${applied:-0}
          pending=$(( local_count - applied ))

          echo "Local migration files : ${local_count}"
          echo "Reported as applied   : ${applied}"
          echo "Pending               : ${pending}"
          limit=${{ inputs.max_pending }}

          if [ "$applied" -gt "$local_count" ]; then
            echo "::error::The remote database reports more applied migrations than"
            echo "::error::exist on disk (${applied} > ${local_count}). Refusing to"
            echo "::error::continue -- local history has diverged from remote."
            exit 1
          fi

          if [ "$pending" -gt "$limit" ]; then
            echo "::error::${pending} migrations are pending but max_pending is ${limit}."
            echo "::error::Either re-run with a higher max_pending, or investigate why"
            echo "::error::unexpected migrations are pending before applying anything."
            exit 1
          fi

          if [ "$pending" -eq 0 ]; then
            echo "::warning::Nothing to apply -- the database is already up to date."
          fi

      - name: Preview migrations
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: no changes will be made."
          supabase db push --linked --dry-run

      - name: Apply migrations
        if: ${{ !inputs.dry_run && !inputs.verify_only }}
        run: |
          supabase db push --linked
          echo "::notice::Migrations applied."

      # The migration run reporting success is not proof the schema changed.
      # `supabase db push` can exit 0 against a database the app does not
      # actually talk to, and `select *` happily returns a row with a missing
      # column simply undefined -- so a migration that never landed is
      # invisible until a filter names the column, at which point PostgREST
      # answers 400 and the only symptom is a search box that quietly drops
      # two of its five tables.
      #
      # This asserts the columns the app filters on, so that failure mode is
      # loud and immediate. Uses the management API rather than the CLI, so it
      # needs only the access token and cannot apply anything.
      - name: Assert expected schema
        if: ${{ always() && (!inputs.dry_run || inputs.verify_only) }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request

          ref = "ijeqwbrrgfsmymsektih"
          token = os.environ["SUPABASE_ACCESS_TOKEN"]

          # (table, column, why the app depends on it)
          expected = [
              ("restaurants", "archived_at", "archive filter + archive write"),
              ("riders", "archived_at", "archive filter + archive write"),
              ("orders", "rejection_reason", "admin order detail read"),
              ("orders", "items", "order line items read"),
              ("restaurants", "revenue", "live aggregate trigger target"),
              ("restaurants", "orders_count", "live aggregate trigger target"),
          ]

          sql = """
          select table_name, column_name
          from information_schema.columns
          where table_schema = 'public'
            and (table_name, column_name) in (
              %s
            )
          """ % ", ".join(
              "('%s', '%s')" % (t, c) for t, c, _ in expected
          )

          body = json.dumps({"query": sql}).encode()
          req = urllib.request.Request(
              "https://api.supabase.com/v1/projects/%s/database/query" % ref,
              data=body,
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              found = {(r["table_name"], r["column_name"]) for r in json.load(resp)}

          missing = [(t, c, why) for t, c, why in expected if (t, c) not in found]
          if missing:
              for t, c, why in missing:
                  print("::error::missing column %s.%s -- %s" % (t, c, why))
              print("::error::The app filters on these columns. A missing one is a")
              print("::error::400 from PostgREST, not a visible schema error.")
              sys.exit(1)

          print("::notice::All %d expected columns are present." % len(expected))
          PY

      - name: Report applied migrations
        if: ${{ inputs.verify_only }}
        run: |
          echo "::group::Migration status"
          supabase migration list || true
          echo "::endgroup::"
