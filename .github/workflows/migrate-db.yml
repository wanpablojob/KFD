# Apply Supabase database migrations to the linked project.
#
# This workflow exists because migrations can only be applied with a direct
# Postgres connection, which needs `SUPABASE_DB_PASSWORD`. Without it, nobody
# (including CI and the Supabase CLI) can apply a migration -- every schema
# change has to be copy-pasted by hand into the dashboard SQL Editor, which is
# unauditable and easy to get wrong.
#
# Deliberate design decisions:
#   * `workflow_dispatch` ONLY. There is no `push`/`schedule` trigger. A
#     migration must never be applied as a side effect of a commit landing.
#   * `environment: production` gates every run behind required reviewers
#     (configure under Settings -> Environments). This is the actual
#     permission boundary: it means an unreviewed change cannot reach the
#     live database without a human approving it.
#   * `max_pending` defaults to 1. Applying a pile of migrations that nobody
#     intended to ship is the classic way to break a production database, so
#     bulk application is opt-in and must be requested deliberately.
#   * The CLI version is pinned. An unpinned CLI silently pulls new major
#     versions, which can change migration semantics between runs.
#
# Required repository secrets:
#   SUPABASE_DB_PASSWORD    -- direct Postgres password (dashboard -> Settings -> Database)
#   SUPABASE_ACCESS_TOKEN   -- personal access token (dashboard -> account -> Access Tokens)
#
# Usage:
#   1. Run with `dry_run: true` first. This prints the SQL without applying it.
#   2. Re-run with `dry_run: false` to apply.

name: Migrate Database

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only -- print and validate the SQL, apply nothing"
        type: boolean
        required: true
        default: true
      max_pending:
        description: >-
          Refuse to run if more than this many migrations are pending.
          Raise deliberately, never reflexively.
        type: number
        required: false
        default: 1
      verify_only:
        description: "Check the schema without applying anything"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Never let two migration runs overlap.
  group: migrate-db
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The approval gate. `environment` is only honoured on a job, never at
    # workflow level -- a top-level key is silently ignored, which would run
    # migrations against production with no human in the loop.
    # Configure required reviewers: Settings -> Environments -> production.
    environment: production
    defaults:
      run:
        working-directory: admin

    # Both tokens must be exported as env vars, not just passed to
    # `setup-cli`. That action runs `supabase login`, but each `run:` step
    # starts a fresh shell that does not inherit the login -- so `supabase
    # link` fails with "Access token not provided" unless the token is also
    # in the environment.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
          token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Initialise local Supabase config
        # `config.toml` is gitignored, so it is absent on a fresh runner.
        # `init` only writes the file; it does not touch existing migrations.
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "config.toml missing -- running supabase init"
            supabase init
          else
            echo "config.toml already present"
          fi

      - name: Link to project
        # Ref is hard-coded on purpose. A workflow that accepts a project ref
        # as input could be pointed at a different database by anyone who can
        # dispatch it.
        run: supabase link --project-ref ijeqwbrrgfsmymsektih

      - name: Report migration status
        env:
          MAX_PENDING: ${{ inputs.max_pending }}
        run: |
          echo "::group::Migration status"
          supabase migration list || true
          echo "::endgroup::"

          # Compare the versions on disk with the versions the database says it
          # has applied. The CLI's table is for humans: its layout has changed
          # between releases, so counting its rows is not a stable contract.
          # The management API returns the version column directly.
          python3 - <<'PY'
          import glob, json, os, re, sys, urllib.error, urllib.request

          ref = "ijeqwbrrgfsmymsektih"
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          endpoint = "https://api.supabase.com/v1/projects/%s/database/query" % ref

          def query(sql):
              body = json.dumps({"query": sql}).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  try:
                      detail = json.loads(detail).get("message", detail)
                  except Exception:
                      pass
                  raise RuntimeError(detail) from None

          local = {}
          for path in sorted(glob.glob("supabase/migrations/*.sql")):
              match = re.match(r"^([0-9]+)", os.path.basename(path))
              if not match:
                  print("::error::%s does not start with a migration version" % path)
                  sys.exit(1)
              local[match.group(1)] = path

          applied = {
              str(row["version"])
              for row in query(
                  "select version from supabase_migrations.schema_migrations"
              )
          }
          pending = sorted(set(local) - applied)
          remote_only = sorted(applied - set(local))

          print("Local migration files : %d" % len(local))
          print("Reported as applied   : %d" % len(applied))
          print("Pending               : %d" % len(pending))
          if pending:
              print("Pending versions      : %s" % ", ".join(pending))

          if remote_only:
              print(
                  "::error::The database has %d migration(s) with no file in "
                  "this checkout: %s" % (len(remote_only), ", ".join(remote_only))
              )
              print(
                  "::error::Refusing to continue -- local history has diverged "
                  "from remote."
              )
              sys.exit(1)

          limit = int(os.environ.get("MAX_PENDING") or 1)
          if len(pending) > limit:
              print(
                  "::error::%d migrations are pending but max_pending is %d."
                  % (len(pending), limit)
              )
              print(
                  "::error::Either re-run with a higher max_pending, or "
                  "investigate why unexpected migrations are pending before "
                  "applying anything."
              )
              sys.exit(1)

          if not pending:
              print("::warning::Nothing to apply -- the database is already up to date.")
          PY

      - name: Preview migrations
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: no changes will be made."
          supabase db push --linked --dry-run

      # `supabase db push --dry-run` prints the pending files and nothing else.
      # It does not parse them. A syntax error therefore passes the dry run and
      # fails on apply, against production -- which is exactly what happened
      # with 0012, and is the worst possible time to find out.
      #
      # This runs each pending migration inside an explicit transaction and
      # rolls it back, so the SQL is genuinely parsed and executed and nothing
      # is committed. It is a stronger check than the dry run above, not a
      # substitute for the assertion step after a real apply: rollback undoes
      # data changes but still takes locks and briefly runs the statements.
      - name: Validate pending SQL
        if: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re, sys, urllib.error, urllib.request

          ref = "ijeqwbrrgfsmymsektih"
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          endpoint = "https://api.supabase.com/v1/projects/%s/database/query" % ref

          def query(sql):
              body = json.dumps({"query": sql}).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  try:
                      detail = json.loads(detail).get("message", detail)
                  except Exception:
                      pass
                  raise RuntimeError(detail) from None

          # Ask the database which versions it has, rather than parsing
          # `supabase migration list` -- the CLI renders versions
          # backtick-wrapped and has changed column layout between releases.
          applied = {
              str(r["version"])
              for r in query("select version from supabase_migrations.schema_migrations")
          }

          pending = []
          for path in sorted(glob.glob("supabase/migrations/*.sql")):
              version = re.match(r"^([0-9]+)", os.path.basename(path)).group(1)
              if version not in applied:
                  pending.append((version, path))

          if not pending:
              print("::notice::No pending migrations to validate.")
              sys.exit(0)

          def missing_object(message):
              # Postgres names the thing a statement could not find, e.g.
              #   relation "public.order_ratings" does not exist
              #   column r.suspended_at does not exist
              #   function public.foo(integer) does not exist
              # Return the last name segment; schema and qualifier do not
              # matter for "does anything in this batch mention it".
              match = re.search(
                  r"\b(?:relation|column|function|type|operator)\s+\"?([\w.]+)\"?\s+does not exist",
                  message,
              )
              return match.group(1).split(".")[-1] if match else None

          print("::notice::Validating %d pending migration(s) in a rolled-back transaction." % len(pending))
          # Two kinds of red, kept apart: sql_errors is "this file does not
          # run"; failures is "production data violates a money invariant".
          # Different fixes, so they are printed with different prefixes.
          sql_errors = []
          failures = []
          deferred = []
          earlier_sql = ""
          for version, path in pending:
              sql = open(path).read()
              # Explicit BEGIN/ROLLBACK in one request, so the work is undone
              # whatever happens. Postgres DDL is transactional; the one thing
              # that is not transactional here is our own belief that we sent
              # both statements, so the rollback is asserted below.
              try:
                  query("begin;\n%s\nrollback;" % sql)
              except RuntimeError as exc:
                  # Each file is validated alone, so one that builds on an
                  # earlier PENDING file cannot succeed here: what that file
                  # creates does not exist yet. Defer -- do not fail -- when the
                  # name Postgres reports missing appears in an earlier pending
                  # file, i.e. this same batch creates it. A name no pending
                  # file mentions stays fatal: that is drift or a typo, which
                  # the apply would stop on too.
                  needed = missing_object(str(exc))
                  if needed and re.search(r"\b%s\b" % re.escape(needed), earlier_sql):
                      deferred.append(
                          "%s needs %s, which an earlier pending file creates"
                          % (os.path.basename(path), needed)
                      )
                  else:
                      sql_errors.append("%s: %s" % (os.path.basename(path), exc))
                  earlier_sql += "\n" + sql
                  continue

              # Prove the rollback actually happened. If the driver ever starts
              # splitting statements, `begin` would run alone and the migration
              # would have committed for real -- so this is checked, not assumed.
              check = "begin; create temp table rollback_probe(i int); rollback;"
              try:
                  query(check)
                  query("select 1 from rollback_probe")
                  sql_errors.append(
                      "%s: rollback did not take effect; the driver is splitting statements"
                      % os.path.basename(path)
                  )
              except RuntimeError:
                  pass  # Expected: the temp table is gone, so the rollback worked.

              print("::notice::%s parses and runs." % os.path.basename(path))
              earlier_sql += "\n" + sql

          # --- Dispute window (0075) --------------------------------------
          # Two failures specific to the recovery feature, both silent:
          #   * a reversed payout still counted in earnings, so the rider's app
          #     and the admin dashboard would show different totals for the same
          #     rider -- the exact thing the checks below exist to prevent, which
          #     is why 0075 excluded reversed rows in both RPCs rather than
          #     trusting a UI to filter them
          #   * a dispute still open after its window closed, which means no
          #     sweep ran and a row is sitting in the one state an operator has
          #     to act on
          #
          # The earnings check below compares against the reversed-aware sum; if
          # 0075 widened a function and missed one, these two disagree and CI
          # fails rather than the disagreement reaching a rider's bank statement.
          if query(
              "select exists (select 1 from information_schema.columns "
              "where table_schema='public' and table_name='rider_payouts' "
              "and column_name='settlement_state') as ok"
          )[0]["ok"]:
              stale_disputes = query(
                  "select count(*) as n from public.rider_payouts "
                  "where settlement_state = 'disputed' "
                  "and review_expires_at is not null "
                  "and review_expires_at <= now()"
              )[0]["n"]
              if stale_disputes:
                  failures.append(
                      "%d disputed payout(s) are past their review window. "
                      "The rider cannot be paid or clawed back until an admin "
                      "calls rider_settle_expired_payouts() or "
                      "resolve_delivery_issue()." % stale_disputes
                  )

              # No reversed row may still be inside a window someone could
              # dispute: it is a terminal state, and leaving review_expires_at
              # in the future would let a second dispute be raised against a
              # payout that has already been clawed back.
              reversible_reversed = query(
                  "select count(*) as n from public.rider_payouts "
                  "where settlement_state = 'reversed' "
                  "and review_expires_at is not null "
                  "and review_expires_at > now()"
              )[0]["n"]
              if reversible_reversed:
                  failures.append(
                      "%d reversed payout(s) still carry a future review window; "
                      "a terminal state must not be disputable" % reversible_reversed
                  )

              # Every payout must carry an expiry, or it can never be disputed
              # and the recovery path is silently dead for that row.
              missing_expiry = query(
                  "select count(*) as n from public.rider_payouts "
                  "where review_expires_at is null"
              )[0]["n"]
              if missing_expiry:
                  failures.append(
                      "%d payout(s) have no review_expires_at; they can never be "
                      "disputed and the 24h window does not apply to them"
                      % missing_expiry
                  )

          # --- Rider money invariants -------------------------------------
          # These exist because of a shipped defect, not a hypothetical. 0050
          # rebuilt claim_order from a stale body and silently dropped the
          # rider_payout freeze, so every real delivery recorded a permanent
          # 0.00 payout and no check anywhere noticed: the ledger, the rider's
          # Earnings tab and the admin payout page all agreed with each other
          # and all reported zero. A structural check cannot see that -- the
          # schema is perfectly correct while the money is wrong. These three
          # compare the VALUES, which is the only place the bug was visible.
          #
          # Deliberately values, not schema. The payout defect passed every
          # column and policy assertion above and still cost real deliveries
          # their pay, so asserting more about the shape of the database would
          # have added confidence without adding safety.
          #
          # Only meaningful once 0038 exists; before it the ledger is empty and
          # a non-empty seeded rider would look like drift. Skip rather than
          # fail if the ledger table is absent.
          if query(
              "select to_regclass('public.rider_payouts') is not null as ok"
          )[0]["ok"]:
              # 1. No completed delivery may be recorded at zero. This is the
              #    exact signature of a missing payout freeze.
              zero_rows = query(
                  "select count(*) as n from public.rider_payouts where amount = 0"
              )[0]["n"]
              if zero_rows:
                  failures.append(
                      "%d rider_payouts row(s) record a 0.00 payout. A "
                      "completed delivery cannot be worth nothing: claim_order "
                      "is not freezing rider_payout. Backfill "
                      "rider_payouts.amount for these orders before riders "
                      "notice." % zero_rows
                  )

              # 2. riders.deliveries must equal the rider's ledger row count.
              #    These are a denormalised copy that 0071 recomputes instead
              #    of incrementing; this catches any other writer.
              delivery_drift = query(
                  "select count(*) as n from public.riders r "
                  "where r.deliveries <> (select count(*)::int "
                  "  from public.rider_payouts p where p.rider_id = r.id)"
              )[0]["n"]
              if delivery_drift:
                  failures.append(
                      "riders.deliveries disagrees with the payout ledger for "
                      "%d rider(s); the counters are a cache of the ledger and "
                      "must be recomputed from it" % delivery_drift
                  )

              # 3. riders.earnings must equal the ledger sum.
              earning_drift = query(
                  "select count(*) as n from public.riders r "
                  "where r.earnings <> coalesce((select sum(p.amount) "
                  "  from public.rider_payouts p where p.rider_id = r.id), 0)"
              )[0]["n"]
              if earning_drift:
                  failures.append(
                      "riders.earnings disagrees with the payout ledger for "
                      "%d rider(s); the app and the admin page would show "
                      "different totals for the same rider" % earning_drift
                  )

              # 4. No order may sit in a rider-deliverable state with no
              #    frozen fee. 0071 refuses to complete such an order, so each
              #    one is a rider who is already stuck.
              unfrozen = query(
                  "select count(*) as n from public.orders "
                  "where rider_payout is null and rider_id is not null "
                  "and status in ('confirmed','preparing','out_for_delivery')"
              )[0]["n"]
              if unfrozen:
                  failures.append(
                      "%d assigned order(s) have no frozen rider_payout; "
                      "rider_mark_delivered refuses these, so they cannot be "
                      "completed until the fee is backfilled" % unfrozen
                  )

          # --- Delivered spend must reconcile ----------------------------
          # Every peso of delivered spend belongs to exactly one place: a
          # customer's own total, or the unattributable bucket. If those two
          # sides do not sum to the platform figure, money is being dropped --
          # and dropping it is silent, because each individual number still
          # looks right.
          #
          # The specific failure this catches: customers.user_id is
          # `on delete set null`, so deleting an auth account orphans every order
          # that referenced it. Those orders match no customer (the aggregate
          # joins on customers.user_id) and are not walk-ins either under the
          # narrower "customer_user_id is null" reading, so their value left
          # both totals and the books stopped adding up.
          #
          # Computed from raw tables rather than by calling
          # admin_customer_stats(): this connection has no JWT, so
          # is_platform_admin() is false and the RPC would refuse. Deriving both
          # sides independently also means the check does not simply agree with
          # the function it is meant to verify.
          if query(
              "select exists (select 1 from information_schema.columns "
              "where table_schema='public' and table_name='customers' "
              "and column_name='user_id') as ok"
          )[0]["ok"]:
              platform = float(
                  query(
                      "select coalesce(sum(total) filter (where status='delivered'),0) as v "
                      "from orders"
                  )[0]["v"]
              )
              attributed = float(
                  query(
                      "select coalesce(sum(o.total),0) as v from orders o "
                      "where o.status='delivered' and exists ("
                      "  select 1 from customers c where c.user_id = o.customer_user_id)"
                  )[0]["v"]
              )
              orphaned = float(
                  query(
                      "select coalesce(sum(o.total),0) as v from orders o "
                      "where o.status='delivered' and o.customer_user_id is not null "
                      "and not exists ("
                      "  select 1 from customers c where c.user_id = o.customer_user_id)"
                  )[0]["v"]
              )
              if abs(platform - attributed - orphaned) > 0.01:
                  failures.append(
                      "delivered spend does not reconcile: platform %.2f, "
                      "attributed %.2f, unattributable %.2f. Every delivered peso "
                      "must land in exactly one of the last two."
                      % (platform, attributed, orphaned)
                  )
              if orphaned:
                  # Not a failure: the bucket exists precisely so these are
                  # counted. Said out loud so nobody reads a non-zero as a bug.
                  print(
                      "::notice::%.2f of delivered spend belongs to orders whose "
                      "customer account no longer exists; it is counted in the "
                      "walk-in bucket, not in any customer's total." % orphaned
                  )

          if deferred:
              print(
                  "::warning::%d pending file(s) build on another pending file "
                  "and cannot run standalone; listed below. The chain itself is "
                  "covered by db-tests.sh, which builds a database from every "
                  "migration in order." % len(deferred)
              )
          for d in deferred:
              print("::notice::Deferred: %s." % d)

          if sql_errors or failures:
              for e in sql_errors:
                  print("::error::" + e)
              for f in failures:
                  print("::error::Data check: " + f)
              print(
                  "::error::%d SQL failure(s), %d data finding(s). A green run "
                  "needs both: a SQL failure is fixed in the migration, a data "
                  "finding in the rows themselves." % (len(sql_errors), len(failures))
              )
              sys.exit(1)

          print("::notice::All %d pending migration(s) are valid." % len(pending))
          PY

      # A dry run proves the SQL is valid. It cannot prove that changing the
      # schema on real data is safe, and a migration that fails on real data
      # is the one failure that stops orders. So the apply step takes a dump
      # of the public schema first and attaches it to the run: "the database
      # is in a bad state" becomes a restore instead of a catastrophe.
      #
      # This is the backup of record for THIS apply. The standing backups are
      # the point-in-time recovery in the Supabase dashboard; this dump is the
      # one that matches the exact state the migration was about to change,
      # which is the state a restore needs.
      #
      # It fails the run when the dump fails or comes out empty. A production
      # write without a way back is worse than a migration that did not
      # happen.
      - name: Take a pre-apply backup
        if: ${{ !inputs.dry_run && !inputs.verify_only }}
        run: |
          mkdir -p backup
          supabase db dump --linked --schema public --file backup/public-schema.sql
          supabase db dump --linked --data-only --schema public --file backup/public-data.sql
          if [ ! -s backup/public-schema.sql ] || [ ! -s backup/public-data.sql ]; then
            echo "::error::The pre-apply backup is empty. Refusing to apply a"
            echo "::error::migration with no way back. Fix the dump and re-run."
            exit 1
          fi
          wc -c backup/public-schema.sql backup/public-data.sql

      - name: Attach the backup to this run
        if: ${{ always() && !inputs.dry_run && !inputs.verify_only }}
        uses: actions/upload-artifact@v4
        with:
          name: pre-apply-backup
          path: backup/
          retention-days: 14
          if-no-files-found: error

      - name: Apply migrations
        if: ${{ !inputs.dry_run && !inputs.verify_only }}
        run: |
          supabase db push --linked
          echo "::notice::Migrations applied."

      # The migration run reporting success is not proof the schema changed.
      # `supabase db push` can exit 0 against a database the app does not
      # actually talk to, and `select *` happily returns a row with a missing
      # column simply undefined -- so a migration that never landed is
      # invisible until a filter names the column, at which point PostgREST
      # answers 400 and the only symptom is a search box that quietly drops
      # two of its five tables.
      #
      # This asserts the columns the app filters on, so that failure mode is
      # loud and immediate. Uses the management API rather than the CLI, so it
      # needs only the access token and cannot apply anything.
      - name: Assert expected schema
        if: ${{ always() && (!inputs.dry_run || inputs.verify_only) }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request

          ref = "ijeqwbrrgfsmymsektih"
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          endpoint = "https://api.supabase.com/v1/projects/%s/database/query" % ref

          def query(sql):
              """Returns parsed rows, or raises RuntimeError carrying the
              database's own message. PostgREST puts a plpgsql RAISE in the
              error body, which is the whole point here."""
              body = json.dumps({"query": sql}).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  try:
                      detail = json.loads(detail).get("message", detail)
                  except Exception:
                      pass
                  raise RuntimeError(detail) from None

          failures = []

          # 1. The columns the app filters on must exist. A migration that
          #    never landed is invisible until something names a column in a
          #    filter, at which point PostgREST answers 400 and the only
          #    symptom is a search box quietly missing two of its five tables.
          expected = [
              ("restaurants", "archived_at", "archive filter + archive write"),
              ("riders", "archived_at", "archive filter + archive write"),
              ("riders", "user_id", "rider account link + rider RLS"),
              ("orders", "rejection_reason", "admin order detail read"),
              ("orders", "items", "order line items read"),
              ("restaurants", "revenue", "live aggregate trigger target"),
              ("restaurants", "orders_count", "live aggregate trigger target"),
              ("orders", "customer_user_id", "customer order tracking + customer RLS"),
              ("orders", "delivery_address", "storefront delivery target"),
              ("orders", "service_fee", "storefront service-fee line"),
              # Phase 1 migrations:
              ("orders", "restaurant_id", "FK to restaurants (0024)"),
              ("orders", "rider_id", "FK to riders (0025)"),
              ("orders", "updated_at", "audit/analytics timestamp (0026)"),
              ("restaurants", "updated_at", "audit/analytics timestamp (0026)"),
              ("riders", "updated_at", "audit/analytics timestamp (0026)"),
              # Phase 2 migrations:
              ("menu_items", "restaurant_id", "FK to restaurants (0027)"),
              ("audit_log", "actor_user_id", "audit trail (0028)"),
          ]
          sql = """
          select table_name, column_name from information_schema.columns
          where table_schema = 'public' and (table_name, column_name) in (%s)
          """ % ", ".join("('%s', '%s')" % (t, c) for t, c, _ in expected)
          found = {(r["table_name"], r["column_name"]) for r in query(sql)}
          for t, c, why in expected:
              if (t, c) not in found:
                  failures.append("missing column %s.%s -- %s" % (t, c, why))

          # 1b. FK constraints from Phase 1 migrations must exist
          fk_checks = [
              ("orders", "orders_restaurant_id_fkey", "FK orders.restaurant_id -> restaurants.id (0024)"),
              ("orders", "orders_rider_id_fkey", "FK orders.rider_id -> riders.id (0025)"),
              ("menu_items", "menu_items_restaurant_id_fkey", "FK menu_items.restaurant_id -> restaurants.id (0027)"),
          ]
          for table, constraint, why in fk_checks:
              if not query(
                  "select 1 from information_schema.table_constraints "
                  "where table_schema = 'public' and table_name = '%s' and constraint_name = '%s'" % (table, constraint)
              ):
                  failures.append("missing FK constraint %s on %s -- %s" % (constraint, table, why))

          # 1d. menu_items.restaurant_id must be NOT NULL (0027)
          nullable_cols = query(
              "select column_name from information_schema.columns "
              "where table_schema = 'public' and table_name = 'menu_items' "
              "and column_name = 'restaurant_id' and is_nullable = 'YES'"
          )
          if nullable_cols:
              failures.append("menu_items.restaurant_id is still nullable; 0027 did not set NOT NULL")

          # 1c. updated_at triggers must exist
          trigger_checks = [
              ("orders", "orders_set_updated_at", "updated_at trigger on orders (0026)"),
              ("restaurants", "restaurants_set_updated_at", "updated_at trigger on restaurants (0026)"),
              ("riders", "riders_set_updated_at", "updated_at trigger on riders (0026)"),
              ("app_users", "app_users_audit", "audit trigger on app_users (0028)"),
          ]
          for table, trigger, why in trigger_checks:
              if not query(
                  "select 1 from information_schema.triggers "
                  "where event_object_schema = 'public' and event_object_table = '%s' and trigger_name = '%s'" % (table, trigger)
              ):
                  failures.append("missing trigger %s on %s -- %s" % (trigger, table, why))

          # 2. app_users must be read-only over PostgREST. The provisioning
          #    functions in 0011 are SECURITY DEFINER, so a direct insert would
          #    bypass every rule they enforce -- no archived-restaurant check,
          #    no protection against rewriting an admin row into a merchant
          #    row. That is the whole reason the FOR ALL policy was replaced.
          policies = query("""
          select policyname, cmd from pg_policies
          where schemaname = 'public' and tablename = 'app_users'
          """)
          writable = sorted(
              (p["policyname"], p["cmd"]) for p in policies
              if p["cmd"] in ("INSERT", "UPDATE", "DELETE", "ALL")
          )
          if writable:
              failures.append(
                  "app_users is writable over PostgREST, bypassing the "
                  "provisioning functions: %s" % writable
              )
          readable = sorted(
              p["cmd"] for p in policies if p["cmd"] == "SELECT"
          )
          if len(readable) < 2:
              failures.append(
                  "app_users should have two SELECT policies (own row, admin); "
                  "found %s" % readable
              )

          # 3. The SECURITY DEFINER functions must refuse a caller that is not
          #    a platform admin. This connection IS such a caller: it runs as
          #    the table owner with no JWT, so auth.uid() is null and
          #    is_platform_admin() is false. A SECURITY DEFINER function that
          #    trusts its caller instead of checking would happily return
          #    every account's email address here, which is why the functions
          #    re-check rather than relying on the grant.
          for sql, label in [
              ("select * from public.merchant_access_list()", "merchant_access_list"),
              ("select public.set_merchant_access('a@b.co', 'rst_01')", "set_merchant_access"),
              ("select public.revoke_merchant_access('a@b.co')", "revoke_merchant_access"),
          ]:
              try:
                  rows = query(sql)
              except RuntimeError as exc:
                  if label == "merchant_access_list":
                      # Returns no rows rather than erroring, which is fine.
                      failures.append("%s raised instead of returning nothing: %s" % (label, exc))
                  elif "Only a platform admin" not in str(exc):
                      failures.append("%s failed for the wrong reason: %s" % (label, exc))
                  continue
              if label == "merchant_access_list":
                  if rows:
                      failures.append(
                          "merchant_access_list returned %d rows to a non-admin"
                          % len(rows)
                      )
              else:
                  failures.append("%s succeeded for a non-admin caller" % label)

          # 4. The public tracking boundary from 0012. This is the one that
          #    matters most, because the anon key is public: if `anon` can
          #    select from orders, then `supabase.from('orders').select('*')`
          #    returns customer names, rider assignments and rejection reasons
          #    for every order in the database, and the tracking page rendering
          #    a subset of columns changes nothing -- the API answers the
          #    request either way. RLS filters rows, never columns, so the
          #    guarantee has to be the absence of a grant.
          if query(
              "select has_table_privilege('anon', 'public.orders', 'SELECT') as ok"
          )[0]["ok"]:
              failures.append(
                  "anon can select from orders; the public tracking path is a "
                  "column-exposure hole, not a safe one"
              )

          for role, label in [("anon", "anon"), ("authenticated", "authenticated")]:
              if not query(
                  "select has_function_privilege('%s', "
                  "'public.track_order(text)', 'EXECUTE') as ok" % role
              )[0]["ok"]:
                  failures.append("%s cannot call track_order" % label)

          # The function must actually refuse, not merely be un-granted. This
          # connection is an unentitled caller (no JWT), and every seeded
          # reference is a legacy sequential one, so a row here means the
          # entropy check is not being enforced.
          legacy = query(
              "select reference from orders order by placed_at limit 1"
          )
          if legacy:
              leaked = query(
                  "select * from public.track_order(%s)"
                  % ("'" + legacy[0]["reference"].replace("'", "''") + "'")
              )
              if leaked:
                  failures.append(
                      "track_order returned a row for the sequential reference %s "
                      "to an unentitled caller" % legacy[0]["reference"]
                  )

          # The reference has to carry the entropy the public path depends on.
          # A silent change here -- a shorter suffix, a sequential generator --
          # would turn the tracking page into an enumeration oracle without any
          # other check noticing. Two calls, to catch a generator that ignores
          # its random source.
          pair = query(
              "select public.mint_order_reference() as a, "
              "public.mint_order_reference() as b"
          )[0]
          for label, minted in (("first", pair["a"]), ("second", pair["b"])):
              if not re.match(r"^#KFD-[0-9A-F]{12}$", minted or ""):
                  failures.append(
                      "mint_order_reference() %s call returned %r, which is not "
                      "the 48-bit pattern the tracking path relies on"
                      % (label, minted)
                  )
          if pair["a"] == pair["b"]:
              failures.append("mint_order_reference() returned the same value twice")

          # Reported, and partly asserted. A null customer_user_id is correct
          # for a walk-in order and cannot be asserted away; but the count is
          # the honest answer to "how much of the order book can be aggregated
          # per customer", which no other check answers.
          #
          # A trackable order, though, IS asserted. 0013 inserted the fixture
          # and did nothing: its id collided with a seeded row, `on conflict do
          # nothing` swallowed it, and the run went green with the public
          # tracking page unable to show anything. "Applied successfully" and
          # "the row is there" are different claims and only one was being
          # checked.
          link = query("""
          select
            count(*) as total,
            count(*) filter (where customer_user_id is not null) as linked,
            count(*) filter (where reference ~ '^#KFD-[0-9A-F]{12}$') as trackable
          from orders
          """)[0]

          if link["trackable"] < 1:
              failures.append(
                  "no order carries a high-entropy reference, so the public "
                  "tracking page cannot be exercised; the fixture insert is "
                  "probably a no-op on an id that already exists"
              )

          # 6. RLS breadth: what a merchant and a customer can actually see.
          #    The new policies are written to be additive ("a customer can
          #    read their own orders", a merchant "their restaurant's"), but
          #    "additive" is a claim about the letter of a policy, not the
          #    rows a role can reach, and strengthening one hat must not
          #    widen another. Same test for each: switch the session into the
          #    Real-Time role, hand it a JWT claiming a real account, count
          #    how many of the OTHER tenants'/people's orders leak, then
          #    roll back. The check runs inside one begin/rollback block per
          #    hat, so production data is never touched.
          def sees(fail_label, jwt):
              rows = query(
                  """
                  begin;
                  select set_config(
                    'request.jwt.claims',
                    '%s',
                    true
                  );
                  set local role authenticated;
                  select
                    count(*) as visible,
                    count(*) filter (
                      where restaurant_id is distinct from
                        (select restaurant_id from app_users
                          where user_id = auth.uid())
                    ) as foreign_rows,
                    (count(*) filter (where reference is not null) > 0)::int
                      as has_reference
                  from orders;
                  rollback;
                  """
                  % jwt.replace("'", "''")
              )
              if not rows or not isinstance(rows, list) or rows[0].get("visible") is None:
                  failures.append(
                      "%s: the management API did not return the RLS counts "
                      "for a multi-statement query (%s)" % (fail_label, str(rows)[:200])
                  )
                  return None
              row = rows[0]
              if row["foreign_rows"] != 0:
                  failures.append(
                      "%s: sees %d order(s) outside the tenant "
                      "(%d visible total)" % (fail_label, row["foreign_rows"], row["visible"])
                  )
              if row["has_reference"] != 1:
                  failures.append(
                      "%s: sees no reference-bearing order, so the test "
                      "could not prove isolation against real data" % fail_label
                  )
              return row

          # A real merchant, so the jwt.claims path -- and the RLS that reads
          # it through auth.uid() -- is exercised exactly as a browser session
          # would. Prefer the restaurant that owns the fixture (rst_01; seeded
          # merchant in 0004): it lets the isolation check also prove positive
          # access to a reference-bearing order, not just absence of leaks.
          merch = query(
              """
              select user_id::text as uid, restaurant_id
                from app_users
               where role = 'merchant' and restaurant_id is not null
               order by (restaurant_id = 'rst_01') desc, restaurant_id
               limit 1
              """
          )
          if not merch:
              failures.append("no merchant account exists to impersonate for the RLS check")
          else:
              m_uid = merch[0]["uid"]
              m_jwt = json.dumps({"sub": m_uid, "role": "authenticated"})
              sees("a merchant", m_jwt)

          # A customer with no orders of their own must read nothing at all,
          # and one with a linked order must read exactly that order. Both
          # states are fabricated on a throwaway order inside the transaction
          # so a real customer is never mislabeled.
          cust_rows = query(
              """
              begin;
              -- customer_user_id references auth.users(id), so the fake
              -- customer has to exist there before we can link an order to
              -- them. Inserted and rolled back with everything else; an
              -- address no row of any other table will ever resolve to.
              insert into auth.users (id, email, aud, role, email_confirmed_at)
                values (
                  '99999999-9999-9999-9999-999999999999',
                  'rls-probe@kfd.invalid',
                  'authenticated',
                  'authenticated',
                  now()
                );
              update orders
                 set customer_user_id = '99999999-9999-9999-9999-999999999999'
               where reference = '#KFD-7A3F9C1E5B20';
              select set_config('request.jwt.claims',
                '{"sub": "99999999-9999-9999-9999-999999999999", "role": "authenticated"}',
                true);
              set local role authenticated;
              -- Deliberately NO WHERE clause. The point is to prove scoping,
              -- and a `where customer_user_id = auth.uid()` would return one
              -- row even under a policy that grants every authenticated user
              -- every order. The count is the whole row set RLS lets through.
              select count(*) as visible from orders;
              rollback;
              """
          )
          if not cust_rows or not isinstance(cust_rows, list) or "visible" not in cust_rows[0]:
              failures.append(
                  "the RLS customer count came back unreadable for a "
                  "multi-statement query (%s)" % str(cust_rows)[:200]
              )
          elif cust_rows[0]["visible"] != 1:
              failures.append(
                  "a customer with one linked order reads %d row(s); RLS on "
                  "orders is not proving customer scoping" % cust_rows[0]["visible"]
              )

          # 7. Storefront (customer role): the browse RLS and order creation.
          #    Same impersonated-transaction approach as the merchant/customer
          #    probes above.
          if not query(
              "select has_function_privilege('authenticated', "
              "'public.is_customer()', 'EXECUTE') as ok"
          )[0]["ok"]:
              failures.append("authenticated cannot call is_customer")
          if not query(
              "select has_function_privilege('authenticated', "
              "'public.register_customer()', 'EXECUTE') as ok"
          )[0]["ok"]:
              failures.append("authenticated cannot call register_customer")
          if not query(
              "select has_function_privilege('authenticated', "
              "'public.customer_place_order(text, jsonb, text, payment_method)', "
              "'EXECUTE') as ok"
          )[0]["ok"]:
              failures.append("authenticated cannot call customer_place_order")

          # No-session callers must be refused before they can do anything,
          # exactly like the provisioning functions in check #3.
          for fn, cannot in [
              ("register_customer", "Sign in to create your customer account"),
              ("customer_place_order('rst_01', '[{\"menu_item_id\": \"mnu_01\", \"quantity\": 1}]', 'a st', 'cash')",
               "Sign in to place an order."),
          ]:
              try:
                  query("select public.%s" % fn)
              except RuntimeError as exc:
                  if cannot not in str(exc):
                      failures.append(
                          "%s raised for the wrong reason (expected %r): %s"
                          % (fn, cannot, exc)
                      )
                  continue
              failures.append(
                  "%s succeeded for a caller with no session (auth.uid() is null)" % fn
              )

          # A customer sees the storefront catalog (active restaurants + menus)
          # and nothing else: bilingual RLS. `status = 'active'` is exactly what
          # the policy asserts -- a suspended/approval restaurant (rst_06 is
          # seeded 'suspended') must be invisible even though the connection
          # also has the authenticated default SELECT grant -- and the count is
          # the whole row set RLS lets through, WHERE-less on purpose.
          store = query(
              """
              begin;
              insert into auth.users (id, email, aud, role, email_confirmed_at)
                values (
                  '88888888-8888-8888-8888-888888888888',
                  'store-probe@kfd.invalid',
                  'authenticated',
                  'authenticated',
                  now()
                );
              insert into app_users (user_id, role)
                values ('88888888-8888-8888-8888-888888888888', 'customer');
              select set_config('request.jwt.claims',
                '{"sub": "88888888-8888-8888-8888-888888888888", "role": "authenticated"}',
                true);
              set local role authenticated;
              select
                count(*) as visible_restaurants,
                count(*) filter (
                  where status <> 'active' or archived_at is not null
                ) as non_active_restaurants
              from restaurants;
              rollback;
              """
          )
          if not store or not isinstance(store, list) or "visible_restaurants" not in store[0]:
              failures.append(
                  "the storefront browse RLS probe returned nothing usable "
                  "(%s)" % str(store)[:200]
              )
          else:
              if store[0].get("non_active_restaurants") != 0:
                  failures.append(
                      "a customer can read %d non-active restaurant(s) through "
                      "the browse policy" % store[0]["non_active_restaurants"]
                  )
              if store[0].get("visible_restaurants", 0) < 1:
                  failures.append(
                      "a customer reads no active restaurants at all; the "
                      "browse policy is excluding the whole catalogue"
                  )

          # A verification harness should report, not crash: an exception here
          # would abort the run before the failure list is printed, hiding
          # every other check. Record it and let the rest of the assertions run.
          try:
              cust_place = query(
                  """
                  begin;
                  insert into auth.users (id, email, aud, role, email_confirmed_at)
                    values (
                      '88888888-8888-8888-8888-888888888888',
                      'store-probe@kfd.invalid',
                      'authenticated',
                      'authenticated',
                      now()
                    );
                  insert into app_users (user_id, role)
                    values ('88888888-8888-8888-8888-888888888888', 'customer');
                  select set_config('request.jwt.claims',
                    '{"sub": "88888888-8888-8888-8888-888888888888", "role": "authenticated"}',
                    true);
                  set local role authenticated;
                  select * from public.customer_place_order(
                    'rst_01',
                    '[{"menu_item_id": "mnu_01", "quantity": 2}]',
                    'Gate St, Kabankalan',
                    'cash'
                  );
                  rollback;
                  """
              )
          except Exception as e:
              cust_place = []
              failures.append(
                  "customer_place_order raised %s: %s" % (type(e).__name__, str(e)[:200])
              )
          if not cust_place or not isinstance(cust_place, list) or "total" not in cust_place[0]:
              failures.append(
                  "customer_place_order returned nothing usable for an "
                  "impersonated customer (%s)" % str(cust_place)[:200]
              )
          else:
              placed = cust_place[0]
              # The subtotal is priced from menu_items server-side, so assert
              # the arithmetic the function performed: read the seeded price for
              # mnu_01 rather than hardcoding it (the row is a moving target).
              price = query(
                  "select price from menu_items where id = 'mnu_01'"
              )
              unit = price[0]["price"] if price else None
              if not price or unit is None:
                  failures.append("mnu_01 is missing; cannot check order pricing")
              else:
                  expected_total = (float(unit) * 2) + 45.00 + 5.00
                  if placed["total"] != expected_total:
                      failures.append(
                          "customer_place_order total %s, expected %s for "
                          "mnu_01 x2 + 45 delivery + 5 service"
                          % (placed["total"], expected_total)
                      )
              if placed["status"] != "pending":
                  failures.append(
                      "customer_place_order created a non-pending order (%s)" % placed["status"]
                  )
              if not re.match(r"^#KFD-[0-9A-F]{12}$", placed["reference"] or ""):
                  failures.append(
                      "customer_place_order minted a non-conforming reference %r" % placed["reference"]
                  )

          # A non-customer (e.g. a rider) must not be able to place orders, and
          # register_customer must never demote a provisioned account.
          noncust = query(
              """
              begin;
              insert into auth.users (id, email, aud, role, email_confirmed_at)
                values (
                  '77777777-7777-7777-7777-777777777777',
                  'noncust-probe@kfd.invalid',
                  'authenticated',
                  'authenticated',
                  now()
                );
              insert into app_users (user_id, role)
                values ('77777777-7777-7777-7777-777777777777', 'rider');
              select set_config('request.jwt.claims',
                '{"sub": "77777777-7777-7777-7777-777777777777", "role": "authenticated"}',
                true);
              set local role authenticated;
              select public.register_customer() as registered,
                     (select role from app_users
                       where user_id = auth.uid()) as role_after;
              rollback;
              """
          )
          if not noncust or not isinstance(noncust, list):
              failures.append(
                  "the register_customer no-demote probe returned nothing "
                  "(%s)" % str(noncust)[:200]
              )
          else:
              row = noncust[0]
              if row.get("role_after") != "rider":
                  failures.append(
                      "register_customer changed an existing role (%s); it must be idempotent"
                      % row.get("role_after")
                  )

          # grab the generation: fresh registrations land as 'customer'
          fresh = query(
              """
              begin;
              insert into auth.users (id, email, aud, role, email_confirmed_at)
                values (
                  '66666666-6666-6666-6666-666666666666',
                  'fresh-probe@kfd.invalid',
                  'authenticated',
                  'authenticated',
                  now()
                );
              select set_config('request.jwt.claims',
                '{"sub": "66666666-6666-6666-6666-666666666666", "role": "authenticated"}',
                true);
              set local role authenticated;
              select public.register_customer() as registered,
                     (select role from app_users
                       where user_id = auth.uid()) as role_after;
              rollback;
              """
          )
          if not fresh or not isinstance(fresh, list):
              failures.append(
                  "the register_customer fresh-registration probe returned "
                  "nothing (%s)" % str(fresh)[:200]
              )
          elif fresh[0].get("role_after") != "customer":
              failures.append(
                  "register_customer did not create a customer role for a fresh "
                  "account (%s)" % fresh[0].get("role_after")
              )

          # 5. The notification read marker. It writes app_users, which 0011
          #    closed to writes on purpose, so the interesting property is that
          #    it can only ever touch the caller's own row. There is no
          #    user-id parameter to point elsewhere, and this connection has
          #    auth.uid() = null, so calling it must be a no-op that neither
          #    updates nor creates a row.
          # Supabase's default privileges grant EXECUTE on every new function in
          # schema public to anon, so `revoke ... from public` leaves the anon
          # grant intact -- which is how 0011's provisioning functions ended up
          # callable with the public key. They refused anyway, because they
          # re-check is_platform_admin() internally, but that left the database
          # relying on a check inside a function instead of on the permission to
          # call it. Asserted per function, so a new function that forgets the
          # explicit revoke is caught here rather than in a pentest.
          for sig, why in [
              ("public.mark_notifications_seen()", "notification read marker"),
              ("public.set_merchant_access(text, text)", "merchant provisioning"),
              ("public.revoke_merchant_access(text)", "merchant revocation"),
              ("public.merchant_access_list()", "account listing"),
              ("public.set_rider_access(text, text)", "rider provisioning"),
              ("public.revoke_rider_access(text)", "rider revocation"),
              ("public.rider_access_list()", "rider account listing"),
              ("public.rider_set_status(text)", "rider availability toggle"),
              ("public.rider_mark_delivered(text)", "rider delivery completion"),
              ("public.is_platform_admin()", "role helper used by RLS policies"),
              ("public.current_merchant_restaurant()", "tenant helper used by RLS policies"),
              ("public.is_customer()", "storefront helper used by RLS policies"),
              ("public.register_customer()", "customer self-service registration"),
              ("public.customer_place_order(text, jsonb, text, payment_method)", "storefront order creation"),
              ("public.search_restaurants(text, text)", "storefront restaurant search"),
          ]:
              if query(
                  "select has_function_privilege('anon', '%s', 'EXECUTE') as ok" % sig
              )[0]["ok"]:
                  failures.append("anon can execute %s (%s)" % (sig, why))

          # ...and the two the public tracking page genuinely needs stay open.
          for sig in ["public.track_order(text)", "public.mint_order_reference()"]:
              if not query(
                  "select has_function_privilege('anon', '%s', 'EXECUTE') as ok" % sig
              )[0]["ok"]:
                  failures.append(
                      "anon cannot execute %s; the signed-out tracking page "
                      "would stop working" % sig
                  )

          if not query(
              "select has_function_privilege("
              "'authenticated', 'public.mark_notifications_seen()', 'EXECUTE') as ok"
          )[0]["ok"]:
              failures.append("authenticated cannot call mark_notifications_seen")

          before = query("select count(*) as n from app_users")[0]["n"]
          marked = query("select public.mark_notifications_seen() as at")
          after = query("select count(*) as n from app_users")[0]["n"]

          if marked and marked[0].get("at") is not None:
              failures.append(
                  "mark_notifications_seen returned a timestamp for a caller "
                  "with no auth.uid()"
              )
          if after != before:
              failures.append(
                  "mark_notifications_seen created an app_users row for a "
                  "caller with no auth.uid() (%d -> %d)" % (before, after)
              )

          if failures:
              for f in failures:
                  print("::error::" + f)
              sys.exit(1)

          print("::notice::All %d columns present." % len(expected))
          print("::notice::app_users is read-only over PostgREST; %d SELECT policies." % len(readable))
          print("::notice::All 3 provisioning functions refuse a non-admin caller.")
          print("::notice::Public tracking: anon has no grant on orders; track_order refuses a sequential reference to an unentitled caller.")
          print("::notice::Function grants: anon can execute only the 2 public-tracking functions; mark_notifications_seen is a no-op without a session.")
          print("::notice::RLS: a merchant reads only its restaurant's rows and a linked customer only their own; impersonated transactions are rolled back.")
          print("::notice::Customer link: %d of %d orders matched a backfill; %d carry a high-entropy reference."
                % (link["linked"], link["total"], link["trackable"]))
          PY

      - name: Report applied migrations
        if: ${{ inputs.verify_only }}
        run: |
          echo "::group::Migration status"
          supabase migration list || true
          echo "::endgroup::"
