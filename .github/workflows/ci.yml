# Continuous Integration for the KFD monorepo.
#
# Runs on every pull request targeting `main` and on every push to `main`.
# Only the affected apps are checked (see the `changes` job), and the
# aggregate `ci-ok` job is the single status check to require in branch
# protection.
#
# Flow:
#   feature/* branch -> pull request -> lint / typecheck / test / build
#                    -> all checks pass -> merge -> main -> deploy

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the monorepo changed so we only run the
  # relevant checks instead of building everything on every PR.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            admin:
              - 'admin/**'
            mobile:
              - 'mobile/**'
            backend:
              - 'backend/**'
            shared:
              - '.github/**'
              - '.vscode/**'
              - '.gitignore'
              - 'README.md'
              - 'package.json'
              - 'package-lock.json'
              - 'commitlint.config.js'
              - 'release-please-config.json'
              - '.release-please-manifest.json'

  # ---- Admin (Next.js) ------------------------------------------------
  admin:
    name: Admin — lint, typecheck, build
    needs: changes
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test --if-present

      - name: Production build
        run: npm run build

  # ---- Mobile (Expo / React Native) -----------------------------------
  mobile:
    name: Mobile — lint, typecheck
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test --if-present
        continue-on-error: true

      # A `tsc --noEmit` clean tree can still fail to bundle: this is exactly
      # what happened when dependabot moved react-native 0.86.3 -> 0.87.1,
      # which removed rn-get-polyfills that the SDK 57 metro-config requires.
      # The RN/Expo version pin is enforced in dependabot.yml; this step makes
      # the breakage loud instead of silent. Env vars are absent in CI, which
      # app.config.js tolerates (it warns and leaves extra undefined).
      - name: Bundle
        env:
          # Placeholders only: app.config.js embeds these into the bundle and
          # the client throws on startup with none set, but the export succeeds
          # either way. They exist so the bundled artifact is representative.
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npx expo export --platform android --output-dir /tmp/kfd-export

  # ---- Backend (NestJS) ------------------------------------------------
  # Dormant until a `backend/` directory exists. Because this job is gated
  # on `backend/**` changes, it only runs once the service is added.
  backend:
    name: Backend — lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present

  # ---- Aggregate gate --------------------------------------------------
  # Always runs, so branch protection can require just this single check.
  # It fails only if a job that actually ran failed or was cancelled;
  # skipped jobs (unaffected apps) are fine.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, admin, mobile, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "Job results: $results"
          if printf '%s' "$results" | grep -Eq 'failure|cancelled'; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All required CI jobs passed."
