# Continuous Integration for the KFD monorepo.
#
# Runs on every pull request targeting `main` and on every push to `main`.
# Only the affected apps are checked (see the `changes` job), and the
# aggregate `ci-ok` job is the single status check to require in branch
# protection.
#
# Flow:
#   feature/* branch -> pull request -> lint / typecheck / test / build
#                    -> all checks pass -> merge -> main -> deploy

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the monorepo changed so we only run the
  # relevant checks instead of building everything on every PR.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            admin:
              - 'admin/**'
              # The admin suite checks the mobile copy of the generated types
              # is identical to admin's, so a mobile-only edit must run it too.
              - 'mobile/src/lib/database.generated.ts'
              - 'scripts/gen-db-types.sh'
            mobile:
              - 'mobile/**'
            backend:
              - 'backend/**'
            shared:
              - '.github/**'
              - '.vscode/**'
              - '.gitignore'
              - 'README.md'
              - 'package.json'
              - 'package-lock.json'
              - 'commitlint.config.js'
              - 'release-please-config.json'
              - '.release-please-manifest.json'

  # ---- Admin (Next.js) ------------------------------------------------
  admin:
    name: Admin — lint, typecheck, build
    needs: changes
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      # Dependabot-triggered runs receive no repository secrets, so on a
      # dependency PR these are empty, `createClient("")` throws while Next
      # prerenders /auth/callback, and the build fails for a reason unrelated
      # to the dependency being bumped. Every Dependabot PR was permanently
      # red. NEXT_PUBLIC_* values are inlined at build time and this build is
      # never deployed -- deploy-admin builds from Vercel's own environment --
      # so a placeholder is enough to compile the same code. The real secret
      # still wins wherever one is available (main, human PRs within the repo).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder-publishable-key' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Blocking, matching scripts/verify.sh. A high or critical advisory in a
        # production dependency is a finding, not a log line: the Next.js
        # critical advisory this rule caught is why the local gate has it.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test --if-present

      - name: Production build
        run: npm run build

  # ---- Database --------------------------------------------------------
  # Apply every migration to a throwaway local Supabase and run the SQL
  # tests. `npm test` only checks the generated type digest; it does not
  # execute the SQL, so a migration that parses but fails on a real schema
  # would otherwise reach production before anything noticed.
  db:
    name: Database — migrations + SQL tests
    needs: changes
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Apply migrations and run SQL tests
        run: scripts/db-tests.sh

  # ---- Mobile (Expo / React Native) -----------------------------------
  mobile:
    name: Mobile — lint, typecheck, test, bundle
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The app is pinned to Expo SDK 57 (`expo` and every `expo-*` package).
      # This compares the installed tree against the versions SDK 57 bundles
      # and fails the build the moment one of them has walked onto another
      # SDK -- which is exactly what a hand-edited version range looks like
      # before it reaches a build. Dependabot's ranges cannot cause this, but
      # a manual bump can. CI=1 keeps the check non-interactive: otherwise
      # the CLI offers to rewrite the lockfile from inside the build.
      - name: Expo SDK alignment
        env:
          CI: "true"
        run: npx expo install --check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test -- --ci

      # A `tsc --noEmit` clean tree can still fail to bundle: this is exactly
      # what happened when dependabot moved react-native 0.86.3 -> 0.87.1,
      # which removed rn-get-polyfills that the SDK 57 metro-config requires.
      # The RN/Expo version pin is enforced in dependabot.yml; this step makes
      # the breakage loud instead of silent. Env vars are absent in CI, which
      # app.config.js tolerates (it warns and leaves extra undefined).
      - name: Bundle
        env:
          # Placeholders only: app.config.js embeds these into the bundle and
          # the client throws on startup with none set, but the export succeeds
          # either way. They exist so the bundled artifact is representative.
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npx expo export --platform android --output-dir /tmp/kfd-export

  # ---- Backend (NestJS) ------------------------------------------------
  # Dormant until a `backend/` directory exists. Because this job is gated
  # on `backend/**` changes, it only runs once the service is added.
  backend:
    name: Backend — lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present

  # ---- Launch readiness ------------------------------------------------
  # The Phase C gate: the store identity, the URLs a store listing points
  # at, and the production key lists. It reads files only, so it costs a
  # few seconds, and it is the difference between finding a missing
  # production key on a launch day and finding it in a pull request.
  launch:
    name: Launch — Phase C preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Phase C preflight
        run: scripts/phase-c-preflight.sh

  # ---- Harness ---------------------------------------------------------
  # The guard is the layer that stops Claude Code from pushing, deploying or
  # reading credentials. Its self-test is cheap and runs on every change, not
  # behind the app filters: a change to the guard alone must still exercise it.
  harness:
    name: Harness — guard self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Guard self-test
        run: node scripts/claude-guard.mjs --self-test

  # ---- Aggregate gate --------------------------------------------------
  # Always runs, so branch protection can require just this single check.
  # It fails only if a job that actually ran failed or was cancelled;
  # skipped jobs (unaffected apps) are fine.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, harness, admin, db, mobile, backend, launch]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "Job results: $results"
          if printf '%s' "$results" | grep -Eq 'failure|cancelled'; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All required CI jobs passed."
