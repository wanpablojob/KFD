# Read-only Vercel diagnostics.
#
# Answers "why is the admin site down?" from the Vercel API instead of from
# URL guessing: which project the secrets point at, which domains are attached
# to it, and what the newest deployments actually are. The deploy workflow's
# failures ("Could not retrieve Project Settings") cannot distinguish a wrong
# token from a wrong project id; this prints both sides.
#
# Safe by construction: GET requests only, workflow_dispatch only, and the
# token is never echoed. Nothing here can deploy, delete or change a setting.
#
#   gh workflow run vercel-status.yml

name: Vercel Status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query the Vercel API (read-only)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$VERCEL_TOKEN" ] || [ -z "$TEAM" ] || [ -z "$PROJECT" ]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID must all be set."
            exit 1
          fi

          api() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "$@"
          }

          echo "::group::Token identity"
          api "https://api.vercel.com/v2/user" \
            | jq '{user: .user.username, id: .user.id, email: .user.email}'
          echo "::endgroup::"

          echo "::group::Team (VERCEL_ORG_ID)"
          api "https://api.vercel.com/v2/teams/$TEAM" \
            | jq '{id, slug, name, plan, createdAt}'
          echo "::endgroup::"

          echo "::group::Project (VERCEL_PROJECT_ID)"
          # The build settings are the point. A project with framework=null and
          # an empty rootDirectory uploads the repository as static files, which
          # is a READY deployment that 404s at every app route.
          api "https://api.vercel.com/v9/projects/$PROJECT?teamId=$TEAM" \
            | jq '{id, name, createdAt, framework, rootDirectory,
                   buildCommand, outputDirectory, installCommand, nodeVersion,
                   gitRepository,
                   liveAlias: (.targets.production | {id, url, readyState, target, alias})}'
          echo "::endgroup::"

          echo "::group::Domains on the project"
          api "https://api.vercel.com/v9/projects/$PROJECT/domains?teamId=$TEAM" \
            | jq -r '.domains[] | "\(.name)\tverified=\(.verified)\ttarget=\(.target // "-")\tgitBranch=\(.gitBranch // "-")"'
          echo "::endgroup::"

          echo "::group::Environment variables (names only; values are never printed)"
          # Which keys exist per environment is public enough to log and is the
          # difference between a build that can reach Supabase and one that
          # silently ships undefined NEXT_PUBLIC_* values. Only the key, target
          # and type are selected -- never .value.
          api "https://api.vercel.com/v9/projects/$PROJECT/env?teamId=$TEAM" \
            | jq -r '(.envs // [])[] | "\(.key)\t\((.target // []) | join(","))\t\(.type)"'
          echo "::endgroup::"

          echo "::group::Newest deployments (any target)"
          # `deployments` can come back null (the earlier version crashed here
          # with "Cannot iterate over null"). Print the response raw in that
          # case instead of dying, so a token/scope problem is visible.
          api "https://api.vercel.com/v6/deployments?projectId=$PROJECT&teamId=$TEAM&limit=10" \
            | jq -r 'if (.deployments | type) != "array"
                     then "no deployments array in the response: \(.)"
                     else (.deployments[] | "\(.created)\t\(.target // "preview")\t\(.readyState)\t\(.url)\t\((.alias // []) | join(","))")
                     end'
          echo "::endgroup::"

          echo "::group::Newest production deployments"
          api "https://api.vercel.com/v6/deployments?projectId=$PROJECT&teamId=$TEAM&target=production&limit=5" \
            | jq -r 'if (.deployments | type) != "array"
                     then "no deployments array in the response: \(.)"
                     else (.deployments[] | "\(.created)\t\(.readyState)\t\(.url)\t\((.alias // []) | join(","))")
                     end'
          echo "::endgroup::"

          echo "::group::Build log of the newest failed deployment"
          # A READY deployment that 404s and an ERROR deployment fail in
          # different places; this is the only place the build's own words show
          # up. Prefer the newest deployment that did not reach READY -- the
          # newest overall is usually the good one that just replaced it.
          # Events come back as a bare array (not {events: []}), so accept both.
          list=$(api "https://api.vercel.com/v6/deployments?projectId=$PROJECT&teamId=$TEAM&limit=10")
          target=$(echo "$list" | jq -r '[(.deployments // [])[] | select(.readyState != "READY")][0] | .uid // .id // empty')
          if [ -z "$target" ]; then
            target=$(echo "$list" | jq -r '((.deployments // [])[0] // {}) | .uid // .id // empty')
          fi
          if [ -n "$target" ]; then
            echo "deployment: $target"
            api "https://api.vercel.com/v3/deployments/$target/events?teamId=$TEAM&builds=1" \
              | jq -r 'if type == "array" then .[] else (.events // [])[] end
                       | (.payload.text // .payload.info // empty) | tostring' \
              | tail -60
          else
            echo "no deployment found"
          fi
          echo "::endgroup::"
