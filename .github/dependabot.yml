# Dependency update automation for the KFD monorepo.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # ---- Admin (Next.js) -------------------------------------------------
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      admin-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # ---- Mobile (Expo / React Native) -----------------------------------
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      mobile-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Expo pins react-native's version in `bundledNativeModules.json`
      # (`expo/bundledNativeModules`). Bumping RN independently of Expo broke
      # the bundle: 0.87 removed `react-native/rn-get-polyfills`, which the
      # SDK 57 metro-config still requires at build time. RN must move with
      # Expo, never on its own.
      - dependency-name: react-native
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # ---- Root tooling (commitlint) --------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # ---- GitHub Actions --------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
